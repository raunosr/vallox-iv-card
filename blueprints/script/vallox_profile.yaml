blueprint:
  name: Vallox IV Card — native profile timer
  description: >-
    One command path for card, sauna and CO₂ automations. Uses the unit's timer;
    never creates a competing Home Assistant return timer. Custom durations are
    allowed only when exactly one Vallox fan is registered. Home/Away/Auto use
    a targeted fan action. Repeated requests are idempotent unless restart is true.
  domain: script
  source_url: https://github.com/raunosr/vallox-iv-card/blob/v2.0.0-beta.2/blueprints/script/vallox_profile.yaml
  homeassistant:
    min_version: 2025.1.0
  input:
    fan:
      name: Vallox fan
      selector:
        entity:
          domain: fan
fields:
  profile:
    name: Profile
    required: true
    selector:
      select:
        options: [home, away, boost, fireplace, extra, auto]
  duration:
    name: Duration in minutes (timed profiles)
    description: Defaults to 30 for Boost and 15 for Fireplace. Extra uses the unit default if omitted.
    selector:
      number:
        min: 1
        max: 65534
        mode: box
  restart:
    name: Explicitly restart an active timer
    default: false
    selector:
      boolean: {}
mode: queued
max: 10
sequence:
  - variables:
      fan_entity: !input fan
      requested: "{{ profile | default('') | lower }}"
      restart_requested: "{{ restart | default(false) | bool }}"
  - if:
      - condition: template
        value_template: >-
          {{ requested not in ['home', 'away', 'boost', 'fireplace', 'extra', 'auto']
             or not has_value(fan_entity)
             or requested not in (state_attr(fan_entity, 'preset_modes') | default([], true) | map('lower') | list) }}
    then:
      - stop: Vallox fan or requested profile is unavailable
        error: true
  - if:
      - condition: template
        value_template: "{{ not restart_requested and (state_attr(fan_entity, 'preset_mode') | default('', true) | lower) == requested }}"
    then:
      - stop: Profile already active; native timer left unchanged
  - choose:
      - conditions: "{{ requested in ['boost', 'fireplace', 'extra'] }}"
        sequence:
          - variables:
              registered_fans: "{{ integration_entities('vallox') | select('match', '^fan[.]') | list }}"
          - if:
              - condition: template
                value_template: "{{ registered_fans | count != 1 or fan_entity not in registered_fans }}"
            then:
              - stop: Custom duration requires exactly one registered Vallox fan; use targeted fan.set_preset_mode for multiple units
                error: true
          - if:
              - condition: template
                value_template: "{{ duration is defined and (not is_number(duration) or duration | float != duration | int or duration | int < 1 or duration | int > 65534) }}"
            then:
              - stop: Duration must be an integer between 1 and 65534 minutes
                error: true
          - choose:
              - conditions: "{{ requested == 'extra' and duration is not defined }}"
                sequence:
                  - action: vallox.set_profile
                    data:
                      profile: "{{ requested }}"
            default:
              - action: vallox.set_profile
                data:
                  profile: "{{ requested }}"
                  duration: "{{ duration | default(15 if requested == 'fireplace' else 30) | int }}"
    default:
      - action: fan.set_preset_mode
        target:
          entity_id: "{{ fan_entity }}"
        data:
          preset_mode: "{{ state_attr(fan_entity, 'preset_modes') | select('match', '(?i)^' ~ requested ~ '$') | first }}"
  - wait_template: "{{ (state_attr(fan_entity, 'preset_mode') | default('', true) | lower) == requested }}"
    timeout: '00:00:15'
    continue_on_timeout: false
